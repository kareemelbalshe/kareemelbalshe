<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad-moqat3a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg-grad-moqat3a)" />
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" fill="none" stroke="#374151" stroke-opacity="0.6" />

  <!-- Window Header -->
  <g transform="translate(0, 0)">
    <circle cx="25" cy="25" r="6" fill="#ef4444" />
    <circle cx="45" cy="25" r="6" fill="#f59e0b" />
    <circle cx="65" cy="25" r="6" fill="#10b981" />
    
    <text x="100" y="30" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Moqat3a App</text>
    <path d="M185 25 L190 20 L190 30 Z" fill="#9ca3af" transform="rotate(-90 187.5 25)" />
    <text x="205" y="30" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Boycott Alternatives Finder</text>
    
    <line x1="0" y1="50" x2="800" y2="50" stroke="#374151" stroke-opacity="0.6" />
  </g>

  <!-- Left Sidebar (Product Scan / Search) -->
  <g transform="translate(20, 70)">
    <rect width="200" height="400" rx="12" fill="#111827" fill-opacity="0.8" stroke="#374151" stroke-opacity="0.6" />
    
    <text x="15" y="30" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SEARCH ENGINE</text>
    
    <!-- Search Bar -->
    <g transform="translate(10, 50)">
      <rect width="180" height="34" rx="6" fill="#1f2937" stroke="#4b5563" />
      <text x="12" y="21" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="12">Type product or scan...</text>
      <!-- Search Magnifier Icon -->
      <circle cx="160" cy="17" r="4" stroke="#9ca3af" stroke-width="1.5" fill="none" />
      <line x1="163" y1="20" x2="167" y2="24" stroke="#9ca3af" stroke-width="1.5" />
    </g>

    <!-- Scan Area (Barcode Visualizer) -->
    <g transform="translate(10, 100)">
      <rect width="180" height="150" rx="8" fill="#1f2937" fill-opacity="0.5" stroke="#374151" />
      <text x="90" y="25" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CAMERA SCANNER</text>
      <!-- Barcode lines -->
      <g transform="translate(30, 45)">
        <rect x="0" y="0" width="4" height="60" fill="#f3f4f6" />
        <rect x="8" y="0" width="8" height="60" fill="#f3f4f6" />
        <rect x="20" y="0" width="2" height="60" fill="#f3f4f6" />
        <rect x="26" y="0" width="6" height="60" fill="#f3f4f6" />
        <rect x="36" y="0" width="8" height="60" fill="#f3f4f6" />
        <rect x="48" y="0" width="2" height="60" fill="#f3f4f6" />
        <rect x="54" y="0" width="4" height="60" fill="#f3f4f6" />
        <rect x="62" y="0" width="8" height="60" fill="#f3f4f6" />
        <rect x="74" y="0" width="2" height="60" fill="#f3f4f6" />
        <rect x="80" y="0" width="6" height="60" fill="#f3f4f6" />
        <rect x="90" y="0" width="8" height="60" fill="#f3f4f6" />
        <rect x="102" y="0" width="2" height="60" fill="#f3f4f6" />
        <rect x="108" y="0" width="4" height="60" fill="#f3f4f6" />
        <rect x="116" y="0" width="4" height="60" fill="#f3f4f6" />
      </g>
      <!-- Green Scan Line -->
      <line x1="15" y1="75" x2="165" y2="75" stroke="#10b981" stroke-width="2" filter="url(#glow-filter)" />
      <text x="90" y="130" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Ready to scan barcode</text>
    </g>

    <!-- Scan Results Count -->
    <g transform="translate(10, 270)">
      <rect width="180" height="70" rx="8" fill="#1f2937" fill-opacity="0.5" stroke="#374151" />
      <text x="15" y="25" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">BOYCOTT DATABASE</text>
      <text x="15" y="50" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">1,500+ Items</text>
    </g>
  </g>

  <!-- Right Content (Alternatives & Matcher) -->
  <g transform="translate(240, 70)" filter="url(#card-shadow)">
    <rect width="540" height="400" rx="12" fill="#111827" fill-opacity="0.8" stroke="#374151" stroke-opacity="0.6" />
    
    <!-- Titles -->
    <text x="25" y="35" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Scan Match &amp; Local Alternatives</text>
    <text x="25" y="55" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Scan details for barcode match: 52010472910</text>
    
    <!-- Scanned Item Panel -->
    <g transform="translate(25, 80)">
      <rect width="490" height="100" rx="10" fill="#1f2937" stroke="#ef4444" stroke-width="1.5" />
      <!-- Warning triangle -->
      <path d="M40 25 L55 55 H25 Z" fill="#ef4444" />
      <text x="40" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">!</text>
      
      <!-- Match Info -->
      <text x="75" y="35" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Product: Coca-Cola (Original 330ml)</text>
      <text x="75" y="55" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Status: BOYCOTT LISTED</text>
      <text x="75" y="75" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Reason: Multi-national parent support policies.</text>
      
      <!-- Red Badge -->
      <rect x="380" y="15" width="95" height="24" rx="12" fill="url(#red-grad)" />
      <text x="427.5" y="31" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">BOYCOTT</text>
    </g>

    <!-- Alternative Suggestions Header -->
    <text x="25" y="210" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Recommended Local Alternatives</text>
    
    <!-- Alternative 1: Spiro Spathis -->
    <g transform="translate(25, 230)">
      <rect width="490" height="64" rx="8" fill="#1f2937" fill-opacity="0.6" stroke="#374151" />
      <circle cx="32" cy="32" r="16" fill="url(#green-grad)" />
      <!-- Soft drink glass icon representation -->
      <path d="M28 24 H36 L34 40 H30 Z" stroke="#ffffff" stroke-width="1.5" fill="none" />
      
      <text x="64" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Spiro Spathis (Local Soda)</text>
      <text x="64" y="46" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">100% Egyptian | Widely Available</text>
      
      <!-- Match percentage badge -->
      <rect x="380" y="18" width="95" height="24" rx="12" fill="#047857" fill-opacity="0.2" stroke="#10b981" />
      <text x="427.5" y="33" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">98% Match</text>
    </g>

    <!-- Alternative 2: V7 Energy -->
    <g transform="translate(25, 305)">
      <rect width="490" height="64" rx="8" fill="#1f2937" fill-opacity="0.6" stroke="#374151" />
      <circle cx="32" cy="32" r="16" fill="url(#green-grad)" />
      <path d="M28 24 H36 L34 40 H30 Z" stroke="#ffffff" stroke-width="1.5" fill="none" />
      
      <text x="64" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">V7 Cola / Energy</text>
      <text x="64" y="46" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Local alternative | High quality ratings</text>
      
      <!-- Match percentage badge -->
      <rect x="380" y="18" width="95" height="24" rx="12" fill="#047857" fill-opacity="0.2" stroke="#10b981" />
      <text x="427.5" y="33" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">92% Match</text>
    </g>
  </g>
</svg>
