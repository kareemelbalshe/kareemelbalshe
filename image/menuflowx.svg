<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <!-- Shadows & Filters -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg-grad)" />
  
  <!-- Outer Window Border (Glassmorphism effect) -->
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.6" />

  <!-- Window Header -->
  <g transform="translate(0, 0)">
    <!-- Window Controls -->
    <circle cx="25" cy="25" r="6" fill="#ef4444" />
    <circle cx="45" cy="25" r="6" fill="#f59e0b" />
    <circle cx="65" cy="25" r="6" fill="#10b981" />
    
    <!-- Title / Breadcrumb -->
    <text x="100" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">MenuFlowX Dashboard</text>
    <path d="M230 25 L235 20 L235 30 Z" fill="#64748b" transform="rotate(-90 232.5 25)" />
    <text x="250" y="30" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Menu Item Builder</text>
    
    <!-- Badge Pro -->
    <rect x="385" y="15" width="48" height="20" rx="10" fill="url(#btn-grad)" />
    <text x="409" y="29" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PRO</text>
    
    <line x1="0" y1="50" x2="800" y2="50" stroke="#334155" stroke-opacity="0.6" />
  </g>

  <!-- Left Sidebar (Menu Items List) -->
  <g transform="translate(20, 70)" filter="url(#card-shadow)">
    <rect width="220" height="400" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-opacity="0.5" />
    
    <!-- Sidebar Header -->
    <text x="15" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MENU ITEMS</text>
    
    <!-- Active Item: Cheeseburger -->
    <g transform="translate(10, 50)">
      <rect width="200" height="48" rx="8" fill="#334155" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="1.5" />
      <circle cx="28" cy="24" r="16" fill="#475569" />
      <!-- Tiny Burger Icon representation -->
      <path d="M20 22 C20 19, 36 19, 36 22 M18 24 H38 M20 26 H36 M19 28 C19 30, 37 30, 37 28" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="54" y="23" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Cheeseburger</text>
      <text x="54" y="37" fill="#8b5cf6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">$14.99</text>
    </g>

    <!-- Item 2: Truffle Fries -->
    <g transform="translate(10, 110)">
      <rect width="200" height="48" rx="8" fill="#1e293b" fill-opacity="0" />
      <circle cx="28" cy="24" r="16" fill="#334155" />
      <path d="M24 16 L22 30 M28 16 L28 32 M32 16 L34 30" stroke="#94a3b8" stroke-width="2" />
      <text x="54" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Truffle Fries</text>
      <text x="54" y="37" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">$8.50</text>
    </g>

    <!-- Item 3: Avocado Toast -->
    <g transform="translate(10, 170)">
      <rect width="200" height="48" rx="8" fill="#1e293b" fill-opacity="0" />
      <circle cx="28" cy="24" r="16" fill="#334155" />
      <path d="M22 20 Q28 14 34 20 Q32 30 28 30 Q24 30 22 20 Z" stroke="#94a3b8" stroke-width="1.5" fill="none" />
      <circle cx="28" cy="22" r="3" fill="#94a3b8" />
      <text x="54" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Avocado Toast</text>
      <text x="54" y="37" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">$11.00</text>
    </g>

    <!-- Item 4: Caesar Salad -->
    <g transform="translate(10, 230)">
      <rect width="200" height="48" rx="8" fill="#1e293b" fill-opacity="0" />
      <circle cx="28" cy="24" r="16" fill="#334155" />
      <circle cx="28" cy="24" r="8" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
      <text x="54" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Caesar Salad</text>
      <text x="54" y="37" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">$12.50</text>
    </g>
  </g>

  <!-- Right Panel (Edit Area with AI features) -->
  <g transform="translate(260, 70)" filter="url(#card-shadow)">
    <rect width="520" height="400" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-opacity="0.5" />
    
    <!-- Form Titles -->
    <text x="25" y="35" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Edit Gourmet Cheeseburger</text>
    <text x="25" y="55" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Update item info and auto-generate descriptions with AI</text>
    
    <!-- Input Field: Name -->
    <g transform="translate(25, 80)">
      <text x="0" y="15" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">ITEM NAME</text>
      <rect x="0" y="23" width="220" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="12" y="47" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Gourmet Cheeseburger</text>
    </g>

    <!-- Input Field: Price -->
    <g transform="translate(265, 80)">
      <text x="0" y="15" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">PRICE ($)</text>
      <rect x="0" y="23" width="230" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="12" y="47" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">14.99</text>
    </g>

    <!-- Gemini Description Generator Box -->
    <g transform="translate(25, 160)">
      <!-- Box Header with AI trigger -->
      <text x="0" y="15" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">MENU DESCRIPTION</text>
      
      <!-- AI Action Button -->
      <g transform="translate(270, -2)" cursor="pointer">
        <rect width="200" height="28" rx="14" fill="url(#btn-grad)" filter="url(#glow-filter)" />
        <!-- Sparkles Icon -->
        <path d="M12 7 L13.5 10.5 L17 12 L13.5 13.5 L12 17 L10.5 13.5 L7 12 L10.5 10.5 Z" fill="#ffffff" />
        <path d="M22 6 L22.5 7.5 L24 8 L22.5 8.5 L22 10 L21.5 8.5 L20 8 L21.5 7.5 Z" fill="#ffffff" transform="scale(0.7) translate(10, 0)" />
        <text x="108" y="18" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Generate with Gemini AI</text>
      </g>

      <!-- Textarea Box (glowing borders) -->
      <rect x="0" y="28" width="470" height="150" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="0.75" y="28.75" width="468.5" height="148.5" rx="7.25" fill="url(#glow-grad)" />
      
      <!-- Generated AI Text (Bilingual) -->
      <!-- English -->
      <text x="15" y="58" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="400">
        "Premium Angus beef patty, flame-grilled and topped with
      </text>
      <text x="15" y="78" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="400">
        melted sharp cheddar cheese, buttered brioche bun, and our
      </text>
      <text x="15" y="98" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="400">
        signature smokey burger sauce. Served fresh."
      </text>
      
      <!-- Divider -->
      <line x1="15" y1="114" x2="455" y2="114" stroke="#334155" stroke-dasharray="4 4" />

      <!-- Arabic -->
      <text x="455" y="136" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" text-anchor="end" font-weight="500">
        "شريحة لحم أنجوس بقري فاخرة، مشوية على اللهب ومغطاة بجبنة
      </text>
      <text x="455" y="156" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" text-anchor="end" font-weight="500">
        الشيدر الحادة الذائبة، خبز البريوش بالزبدة، وصلصة البرجر المدخنة الخاصة بنا."
      </text>

      <!-- Status indicator -->
      <g transform="translate(15, 192)">
        <circle cx="0" cy="-4" r="4" fill="#10b981" />
        <text x="12" y="0" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Gemini model: gemini-2.5-flash-lite</text>
        <text x="210" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">| Token usage: 104 input, 82 output</text>
      </g>
    </g>

    <!-- Save Button -->
    <g transform="translate(375, 345)">
      <rect width="120" height="36" rx="6" fill="#3b82f6" />
      <text x="60" y="22" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Save Changes</text>
    </g>
  </g>
</svg>
