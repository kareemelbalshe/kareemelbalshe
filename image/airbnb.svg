<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad-airbnb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="airbnb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A5F" />
      <stop offset="100%" stop-color="#FF7A7F" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5A5F" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF5A5F" stop-opacity="0" />
    </linearGradient>
    <!-- Shadows & Filters -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg-grad-airbnb)" />
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" fill="none" stroke="#1f2937" stroke-opacity="0.6" />

  <!-- Window Header -->
  <g transform="translate(0, 0)">
    <circle cx="25" cy="25" r="6" fill="#ef4444" />
    <circle cx="45" cy="25" r="6" fill="#f59e0b" />
    <circle cx="65" cy="25" r="6" fill="#10b981" />
    
    <text x="100" y="30" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Airbnb Clone Dashboard</text>
    <path d="M240 25 L245 20 L245 30 Z" fill="#9ca3af" transform="rotate(-90 242.5 25)" />
    <text x="260" y="30" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Property Listings &amp; Bookings (.NET Core / Angular)</text>
    
    <line x1="0" y1="50" x2="800" y2="50" stroke="#1f2937" stroke-opacity="0.6" />
  </g>

  <!-- Left Sidebar (Filters / Quick Search) -->
  <g transform="translate(20, 70)">
    <rect width="180" height="400" rx="12" fill="#111827" fill-opacity="0.8" stroke="#1f2937" stroke-opacity="0.6" />
    
    <text x="15" y="30" fill="#ff5a5f" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SEARCH PADS</text>
    
    <!-- Filter: Location -->
    <g transform="translate(10, 50)">
      <text x="5" y="12" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">WHERE</text>
      <rect x="0" y="18" width="160" height="34" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="12" y="39" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Cairo, Egypt</text>
    </g>

    <!-- Filter: Dates -->
    <g transform="translate(10, 115)">
      <text x="5" y="12" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">CHECK-IN / OUT</text>
      <rect x="0" y="18" width="160" height="34" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="12" y="39" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11">Select dates...</text>
    </g>

    <!-- Filter: Price Range -->
    <g transform="translate(10, 180)">
      <text x="5" y="12" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">BUDGET ($)</text>
      <rect x="0" y="18" width="160" height="34" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="12" y="39" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">$50 - $250 / night</text>
    </g>

    <!-- SignalR Connection Status -->
    <g transform="translate(10, 340)">
      <rect width="160" height="40" rx="8" fill="#1f2937" fill-opacity="0.4" stroke="#374151" />
      <circle cx="20" cy="20" r="5" fill="#10b981" />
      <text x="32" y="24" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">SignalR Connected</text>
    </g>
  </g>

  <!-- Right Content Area (Details & AI Rec) -->
  <g transform="translate(220, 70)" filter="url(#card-shadow)">
    <rect width="560" height="400" rx="12" fill="#111827" fill-opacity="0.8" stroke="#1f2937" stroke-opacity="0.6" />
    
    <!-- Image Slider Frame -->
    <g transform="translate(25, 25)">
      <rect width="510" height="160" rx="10" fill="#1f2937" stroke="#374151" />
      <!-- Drawing a simple vector house and sunset -->
      <path d="M120 120 L220 50 L320 120 Z" fill="#111827" opacity="0.6" />
      <circle cx="380" cy="70" r="20" fill="#f59e0b" opacity="0.3" />
      <line x1="0" y1="120" x2="510" y2="120" stroke="#374151" stroke-width="2" />
      <text x="255" y="90" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Premium Nile View Apartment</text>
      <text x="255" y="112" fill="#ff5a5f" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Maadi, Cairo | ★ 4.92 (128 reviews)</text>
    </g>

    <!-- AI Recommendation Banner -->
    <g transform="translate(25, 200)">
      <rect width="510" height="42" rx="8" fill="#ff5a5f" fill-opacity="0.1" stroke="#ff5a5f" stroke-width="1" />
      <!-- Sparkle icons -->
      <path d="M22 13 L23.5 16.5 L27 18 L23.5 19.5 L22 23 L20.5 19.5 L17 18 L20.5 16.5 Z" fill="#ff5a5f" />
      <text x="40" y="26" fill="#ff7a7f" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">AI Recommendation Score: 98% Match</text>
      <text x="495" y="26" fill="#ff5a5f" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">Based on your preferences</text>
    </g>

    <!-- Property Details Column -->
    <g transform="translate(25, 260)">
      <text x="0" y="15" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Entire apartment hosted by Kareem</text>
      <text x="0" y="35" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">4 guests · 2 bedrooms · 3 beds · 2 baths</text>
      
      <!-- Tech highlight points -->
      <g transform="translate(0, 55)">
        <circle cx="5" cy="5" r="3" fill="#ff5a5f" />
        <text x="15" y="9" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Backend: ASP.NET Core Web API &amp; Clean Architecture</text>
      </g>
      <g transform="translate(0, 75)">
        <circle cx="5" cy="5" r="3" fill="#ff5a5f" />
        <text x="15" y="9" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Database: EF Core with Microsoft SQL Server</text>
      </g>
      <g transform="translate(0, 95)">
        <circle cx="5" cy="5" r="3" fill="#ff5a5f" />
        <text x="15" y="9" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Frontend: Angular Framework with SignalR Real-Time chat</text>
      </g>
    </g>

    <!-- Pricing and Booking Card (Floating style) -->
    <g transform="translate(370, 260)">
      <rect width="165" height="115" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="15" y="30" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">$120</text>
      <text x="60" y="28" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">/ night</text>
      
      <!-- Reserve Button -->
      <g transform="translate(15, 55)">
        <rect width="135" height="34" rx="6" fill="url(#airbnb-grad)" filter="url(#glow-filter)" />
        <text x="67.5" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Reserve Now</text>
      </g>
    </g>
  </g>
</svg>
